global:
  # Align Prometheus scrape interval with the OTel SDKs' export interval for consistency (see OTEL_METRIC_EXPORT_INTERVAL)
  scrape_interval: 60s

otlp:
  keep_identifying_resource_attributes: true
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - service.criticality
    - cloud.availability_zone
    - cloud.region
    - deployment.environment.name

    # When deploying on Kubernetes, resource attributes used to identify the
    # kubernetes resources in dashboards and alerts.
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.node.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
    - container.name

    # When deploying on VMs, resource attributes used to identify
    # the host in dashboards and alerts.
    - host.name

    # PostgreSQL resource attributes produced by the OTel Collector PostgreSQL receiver
    # and used in dashboards and alerts.
    # See https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/receiver/postgresqlreceiver/metadata.yaml
    - postgresql.database.name
    - postgresql.schema.name
    - postgresql.table.name
    - postgresql.index.name

    # Kafka resource attributes produced by the OTel Collector Kafka receiver
    # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver/kafkametricsreceiver
    - kafka.cluster.alias

    # See https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/v0.142.0/connector/spanmetricsconnector/README.md#known-limitation-the-single-writer-principle
    - collector.instance.id
storage:
  tsdb:
    out_of_order_time_window: 30m

# =============================================================================
# ADICAO DO EXPERIMENTO — raspagem direta do cAdvisor
# =============================================================================
# A configuracao acima e copia verbatim de src/prometheus/prometheus-config.yaml
# da release 3.0.0, que NAO possui nenhum bloco `scrape_configs`: o Prometheus
# do demo recebe tudo por OTLP push, vindo do proprio Collector.
#
# Ai esta a circularidade que este bloco resolve. Medir o Collector pelo
# receiver docker_stats significaria fazer o instrumento passar por dentro do
# sistema medido — e, pior, se o Collector saturar no cenario de TESTE, a
# coleta atrasa ou e descartada exatamente nos picos em que o dado importa.
#
# O cAdvisor roda em container separado e e raspado DIRETAMENTE pelo
# Prometheus, fora do caminho de tratamento. O receiver docker_stats continua
# ligado nos dois cenarios como fator de controle (gera carga igual dos dois
# lados), mas nao e a fonte de medicao.
scrape_configs:
  - job_name: cadvisor
    # 75s: cada amostra de CPU e a media de um intervalo de 75s, sem
    # sobreposicao com o vizinho (ver irate em coletar.sh), e a memoria e a
    # leitura daquele instante. 30 min de medicao dao 25 pontos por serie.
    #
    # O cAdvisor continua lendo o SO a cada 5s (compose.extras.yaml): cada
    # raspagem encontra um dado de no maximo 5s de idade. Com os dois ciclos
    # em 75s, nao sincronizados, uma raspagem podia reler a mesma leitura —
    # ponto de CPU zero seguido de um ponto dobrado.
    scrape_interval: 75s
    scrape_timeout: 4s
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          # cenario.sh substitui __CENARIO__ ao gerar prometheus-config.generated.yaml.
          # O Prometheus NAO expande variaveis de ambiente em static_configs, por isso
          # a substituicao e feita na geracao do arquivo, e nao em runtime.
          cenario: '__CENARIO__'
